name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The black-box tests drive the built binary against fake nono and herdr
      # CLIs; Node is only the test runner (nothing in the plugin needs it).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
