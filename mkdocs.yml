site_name: herdr-nono-plugin
site_description: Run coding agents from Herdr inside nono sandboxes.
# `just docs` overrides this so the local preview is served at the root.
site_url: !ENV [DOCS_SITE_URL, "https://schemaitat.github.io/herdr-nono-plugin/"]
repo_url: https://github.com/schemaitat/herdr-nono-plugin
repo_name: schemaitat/herdr-nono-plugin
edit_uri: ""

# The pages are the repo's own Markdown: README.md becomes the home page and
# CHANGELOG.md the changelog (added by the hook), docs/ the rest. The nav is
# the left sidebar.
docs_dir: docs
hooks:
  - .github/mkdocs/hooks.py

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Use:
      - Key bindings: key-bindings.md
      - Sandboxes overlay: overlay.md
      - Working with agents: agents.md
      - Profiles: profiles.md
      - Troubleshooting: troubleshooting.md
  - Security: security.md
  - Reference:
      - Configuration: configuration.md
      - Actions and scripting: actions.md
  - About:
      - Design: design.md
      - Development: development.md
      - Changelog: changelog.md

# Fail the strict build on pages missing from nav and on broken links.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite

plugins:
  - search
