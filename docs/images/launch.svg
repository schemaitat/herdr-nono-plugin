<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" role="img" aria-labelledby="title desc">
  <title id="title">Agent launch and verification</title>
  <desc id="desc">Herdr starts the action, which saves a pane mapping and starts the bridge. The bridge starts a private server and client in separate nono sandboxes, verifies both from the host, and saves the result.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b70"/></marker>
  </defs>
  <rect width="1080" height="600" rx="12" fill="#ffffff"/>
  <text x="40" y="44" fill="#263238" font-family="sans-serif" font-size="21" font-weight="700">One agent, two sandboxes</text>
  <text x="40" y="72" fill="#455a64" font-family="sans-serif" font-size="15">Host processes and state remain outside the sandboxes.</text>

  <g fill="#eaf5f3" stroke="#176b70" stroke-width="2">
    <rect x="40" y="115" width="250" height="102" rx="10"/>
    <rect x="415" y="115" width="250" height="102" rx="10"/>
    <rect x="790" y="115" width="250" height="102" rx="10"/>
    <rect x="395" y="502" width="290" height="72" rx="10"/>
  </g>
  <g fill="#eef2ff" stroke="#455aa0" stroke-width="2">
    <rect x="100" y="315" width="355" height="127" rx="10"/>
    <rect x="625" y="315" width="355" height="127" rx="10"/>
  </g>

  <g font-family="sans-serif" text-anchor="middle" fill="#172b35">
    <text x="165" y="151" font-size="19" font-weight="700">Herdr action</text>
    <text x="165" y="178" font-size="15">Split pane; start bridge</text>
    <text x="165" y="200" font-size="15">Short-lived host process</text>
    <text x="540" y="151" font-size="19" font-weight="700">Pane mapping</text>
    <text x="540" y="178" font-size="15">Provisional → running</text>
    <text x="540" y="200" font-size="15">→ exited / failed</text>
    <text x="915" y="151" font-size="19" font-weight="700">Bridge</text>
    <text x="915" y="178" font-size="15">Runs in the agent pane</text>
    <text x="915" y="200" font-size="15">Owns both lifecycles</text>
    <text x="277" y="350" font-size="19" font-weight="700">Server sandbox</text>
    <text x="277" y="381" font-size="15">opencode serve on private port P</text>
    <text x="277" y="410" font-size="15">Model loop and every tool call</text>
    <text x="802" y="350" font-size="19" font-weight="700">Client sandbox</text>
    <text x="802" y="381" font-size="15">opencode --server 127.0.0.1:P</text>
    <text x="802" y="410" font-size="15">Interactive TUI in the pane</text>
    <text x="540" y="531" font-size="18" font-weight="700">Host verification</text>
    <text x="540" y="556" font-size="15">Check both process trees via /proc</text>
  </g>

  <g fill="none" stroke="#176b70" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M 290 166 H 405"/>
    <path d="M 665 166 H 780"/>
    <path d="M 880 217 V 263 H 277 V 305"/>
    <path d="M 950 217 V 305"/>
    <path d="M 625 380 H 465"/>
    <path d="M 277 442 V 474 H 477 V 492"/>
    <path d="M 802 442 V 474 H 603 V 492"/>
    <path d="M 395 538 H 20 V 98 H 540 V 105"/>
  </g>
  <g fill="#38545c" font-family="sans-serif" font-size="14" text-anchor="middle">
    <text x="347" y="152">save</text>
    <text x="723" y="152">read</text>
    <text x="549" y="254">start server, then client</text>
    <text x="540" y="366">port P + password</text>
    <text x="89" y="483">record result</text>
  </g>
</svg>
