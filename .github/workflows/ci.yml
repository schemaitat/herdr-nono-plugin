name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The Node black-box tests are the parity suite: they run the actions, the
      # bridge and the event hook through the Rust binary against the same fakes.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build
      - run: HERDR_NONO_IMPL=rust node --test test/actions.test.mjs test/bridge.test.mjs test/events.test.mjs test/upgrade.test.mjs
